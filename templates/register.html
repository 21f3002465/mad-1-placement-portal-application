{% extends 'base.html' %}
{% block content %}
<div class="container-fluid row justify-content-center mt-5">
     <div class="col-md-4">
          <div class="card shadow-sm">
             <div class="card-header bg-info text-white text-center"><h4>Register</h4></div>
             <div class="card-body">
                <form method="POST" action="{{ url_for('authenticate.register')}}">
                     <div class="mb-3">
                        <label>Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                     <div class="mb-3">
                        <label>Email</label>
                          <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com" name="email">
                     </div>
                     <div class="mb-3">
                        <label>Password</label>
                        <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock" name="password">
                        <div id="passwordHelpBlock" class="form-text">
                            Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces, special characters, or emoji.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select name="role" class="form-select" required>
                            <option value="student">student</option>
                            <option value="company">company</option>
                        </select>
                    </div>
                    <button type='submit' class="btn btn-info w-100">Register</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{{ url_for('authenticate.login')}}">Created an account? Login</a>
            </div>
        </div>
    </div>
 </div>
</div>
{% endblock %}
