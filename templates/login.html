{% extends 'base.html' %}
{% block content %}
<div class="container-fluid row justify-content-center mt-5">
     <div class="col-md-4">
          <div class="card shadow-sm">
             <div class="card-header bg-primary text-white text-center"><h4>Login</h4></div>
             <div class="card-body">
                <form method="POST" action="{{ url_for('authenticate.login')}}"> 
                     <div class="mb-3">
                        <label>Email</label>
                          <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com" name="email">
                     </div>
                     <div class="mb-3">
                        <label>Password</label>
                        <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock" name="password">
                          </div>
                    <button type='submit' class="btn btn-primary w-100">Login</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{{ url_for('authenticate.register')}}">Don't have an account? Register</a>
            </div>
        </div>
    </div>
 </div>
</div>
{% endblock %}
